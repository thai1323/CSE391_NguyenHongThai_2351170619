<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions & Animations Lab - TLU</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div class="demo-container">
        <section class="demo-section">
            <h3>Effect 4: Loading Spinner (Xoay vô hạn)</h3>
            <div class="spinner-wrapper">
                <div class="loading-spinner"></div>
                <p>Đang tải dữ liệu sản phẩm...</p>
            </div>
        </section>

        <section class="demo-section">
            <h3>Effect 1, 2, 3 & 5: Product Card Interaction</h3>
            
            <div class="products-list">
                
                <div class="product-card fade-in-element">
                    <div class="img-container">
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" alt="Giày Nike">
                    </div>
                    <div class="card-info">
                        <h4>Nike Air Max Ultra</h4>
                        <p class="price">3.450.000đ</p>
                        <button class="btn-buy">Mua ngay</button>
                    </div>
                </div>

                <div class="product-card fade-in-element">
                    <div class="img-container">
                        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Đồng hồ">
                    </div>
                    <div class="card-info">
                        <h4>Đồng hồ Minimalist</h4>
                        <p class="price">1.890.000đ</p>
                        <button class="btn-buy">Mua ngay</button>
                    </div>
                </div>

            </div>
        </section>
    </div>

</body>
</html>
