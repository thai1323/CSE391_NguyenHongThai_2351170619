<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài B3 — Infinite Scroll Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="gallery-header">
        <h1>Thư Viện Ảnh Vô Hạn</h1>
        <p>Cuộn xuống dưới để tự động tải thêm hình ảnh bằng IntersectionObserver</p>
    </header>

    <main id="imageGrid" class="image-grid">
        </main>

    <div id="load-trigger" class="load-trigger-container">
        <div class="loading-indicator">
            <div class="dot-spinner"></div>
            <span>Đang tải thêm ảnh mới...</span>
        </div>
    </div>

    <div id="lightboxModal" class="lightbox-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <button id="closeLightbox" class="lightbox-close-btn" aria-label="Đóng cửa sổ">&times;</button>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="Ảnh phóng to lớn">
            <div id="lightboxCaption" class="lightbox-caption">Tên tác giả</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
