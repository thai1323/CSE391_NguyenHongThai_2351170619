<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài B1 — Todo App Hoàn Chỉnh</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="todo-wrapper">
        <header class="todo-header">
            <h1>todos</h1>
        </header>

        <main class="todo-box">
            <form id="todoForm" class="todo-form">
                <input type="text" id="todoInput" placeholder="Bạn cần làm gì tiếp theo?" autocomplete="off">
                <button type="submit" id="addBtn" aria-label="Thêm việc cần làm"> Add </button>
            </form>

            <ul id="todoList" class="todo-list">
                </ul>

            <footer class="todo-footer">
                <span id="todoCount" class="todo-count">0 items left</span>
                
                <div class="filters">
                    <button data-filter="all" class="filter-btn active">All</button>
                    <button data-filter="active" class="filter-btn">Active</button>
                    <button data-filter="completed" class="filter-btn">Completed</button>
                </div>

                <button id="clearCompleted" class="clear-completed">Clear completed</button>
            </footer>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
